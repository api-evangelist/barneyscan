name: Barneyscan
description: Barneyscan was a San Leandro, California color imaging company founded in 1986 that built
  one of the first high-quality 24-bit color film scanners and related graphic-arts software for the
  press and prepress industry. It is best known as the origin of Adobe Photoshop, whose early version
  0.87 shipped bundled with Barneyscan scanners as "Barneyscan XP" before Adobe licensed it. Backed by
  Battery Ventures, Bay Partners, and OSCCO Ventures, the company was acquired by PixelCraft on
  March 1, 1993 and no longer operates. It has no live website, developer portal, or public API surface,
  so there is nothing for the enrichment pipeline to harvest.
